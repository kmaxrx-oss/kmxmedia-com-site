[project]
name = "kmxmedia-com-site"
type = "Astro static / non-CMS"
primary_goal = "A conversion-first Colorado Springs web design homepage where the intake form and live recommendation panel are the product experience."

[paths]
agents_file = "AGENTS.md"
bucket_doc = "docs/kmxmedia-content-strategy-buckets.md"
homepage_text_mockup = "docs/homepage-text-mockup-v2.md"
homepage_text_mockup_checkpoint = "docs/homepage-text-mockup.md"
schema_content_spec = "docs/schema-content-spec.md"
ai_readable_grid_spec = "docs/ai-readable-grid-spec.md"
media_slot_alt_inventory = "docs/media-slot-alt-inventory.md"
placeholder_image = "src/assets/placeholder.png"

[asset_conventions]
icons = "src/assets/icons/*.jpg"
diagrams = "src/assets/diagrams/*.jpg"
texture = "src/assets/textures/subtle-local-grid.jpg"

[commands]
build = "npm run build"
preview = "npm run preview"

[rules]
require_bucket_doc_before_content = true
require_mockup_before_build = true
require_schema_truth_to_visible_content = true
no_primary_contact_me_for_quote = true
no_deploy_without_authorization = true

[sensitive]
forbidden = [".vscode/sftp.json"]
never_commit = [".vscode/sftp.json"]

[blocked_until_verified]
public_address = true
real_service_areas = true
reviews_or_ratings = true
exact_prices = true
testimonials = true
case_studies = true
